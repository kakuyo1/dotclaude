name: secret-scan

# Backstop for the local pre-commit gate, which can be bypassed with
# `git commit --no-verify` and does not exist at all in a fresh clone until
# `bash setup.sh` has been run. This job cannot be talked out of the way.
#
# The repo is public, so the asymmetry is decisive: free minutes, a few
# seconds of runtime, and the downside of a miss is a world-readable
# credential on a public remote.
#
# Note: the binary is installed directly rather than via
# gitleaks/gitleaks-action@v2, which requires a GITLEAKS_LICENSE secret on
# organization accounts. The checksum is derived from the release's own
# checksums file at runtime, so no hash is hardcoded here.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, or the scan is meaningless

      - name: Install the latest gitleaks release
        run: |
          set -euo pipefail
          cd /tmp
          # Resolve the newest tag from the /releases/latest redirect rather than
          # the REST API: the API answers 403 from shared egress IPs often enough
          # to make this job flaky, while the redirect is served unconditionally.
          tag=$(curl -sSI -o /dev/null -w '%{redirect_url}' \
                  https://github.com/gitleaks/gitleaks/releases/latest | sed 's#.*/tag/##')
          case "$tag" in
            v[0-9]*) : ;;
            *) echo "could not resolve the latest gitleaks tag (got '$tag')"; exit 1 ;;
          esac
          ver=${tag#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/$tag"
          curl -sSfL -o gl.tgz  "$base/gitleaks_${ver}_linux_x64.tar.gz"
          curl -sSfL -o gl.sums "$base/gitleaks_${ver}_checksums.txt"
          # The checksum comes from the same release, so it proves the download is
          # intact, not that the release itself is trustworthy. Rely on the
          # upstream project for the latter.
          echo "$(grep 'linux_x64.tar.gz' gl.sums | awk '{print $1}')  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks version

      - name: Scan full history
        run: /tmp/gitleaks git --redact -v --no-banner --config .gitleaks.toml .
